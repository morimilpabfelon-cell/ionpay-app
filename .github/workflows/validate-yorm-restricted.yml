name: Yorm restricted-scope validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - rebrand/yorm-pay-icon

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push' || github.head_ref == 'rebrand/yorm-pay-icon'
    name: Build, API tests, Android sync, approved restricted scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Founder-approved restricted scope guard
        shell: pwsh
        run: ./scripts/pre-pr-check.ps1 -SkipInstall -SkipValidation -AllowRestricted

      - name: Build
        run: pnpm build

      - name: API tests
        run: pnpm api:test

      - name: Android sync
        run: pnpm android:sync

      - name: Verify clean generated state
        run: git diff --exit-code
