name: ionPAY Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Build, API tests, and scope guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scope guard
        shell: pwsh
        env:
          RESTRICTED_SCOPE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'scope-approved') }}
        run: |
          if ($env:RESTRICTED_SCOPE_APPROVED -eq 'true') {
            ./scripts/pre-pr-check.ps1 -SkipInstall -SkipValidation -AllowRestricted
          } else {
            ./scripts/pre-pr-check.ps1 -SkipInstall -SkipValidation
          }

      - name: Build
        run: pnpm build

      - name: API tests
        run: pnpm api:test

      - name: Android sync
        run: pnpm android:sync

      - name: Verify clean generated state
        run: git diff --exit-code
