name: Apply Yorm rebrand

on:
  push:
    branches:
      - rebrand/yorm-pay-icon

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebrand branch
        uses: actions/checkout@v4
        with:
          ref: rebrand/yorm-pay-icon
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Apply controlled migration
        run: python tools/apply_yorm_rebrand.py

      - name: Remove one-shot implementation files
        run: |
          rm tools/apply_yorm_rebrand.py
          rm .github/workflows/apply-yorm-rebrand.yml

      - name: Commit implementation
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Rebrand app identity to Yorm [yorm-rebrand]"
          git push origin HEAD:rebrand/yorm-pay-icon
