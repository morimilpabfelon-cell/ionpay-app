<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: Arial, sans-serif; margin: 16px; color: #0a0a0b; }
      h1 { font-size: 16px; margin: 0 0 8px; }
      p { font-size: 12px; color: #555; line-height: 1.45; }
      textarea { width: 100%; height: 180px; font-family: monospace; font-size: 11px; box-sizing: border-box; }
      input { width: 100%; box-sizing: border-box; padding: 8px; }
      button { margin-top: 12px; width: 100%; padding: 10px; border: 0; border-radius: 10px; background: #0a0a0b; color: white; font-weight: 700; }
      .warning { background: #f4f4ec; padding: 10px; border-radius: 10px; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>ionPAY Screen Builder</h1>
    <div class="warning">Internal design tooling only. Other agents may observe. Generation requires UI/UX agent or founder approval.</div>
    <p>Paste a screen pack JSON and generate editable Figma frames.</p>
    <textarea id="pack">{"name":"ionPAY Core Example","screens":[{"title":"Home","amount":"S/ 2,840.60"}]}</textarea>
    <p>Authorization phrase</p>
    <input id="auth" placeholder="UIUX_AGENT_DESIGN_RUN" />
    <button id="generate">Generate editable screens</button>
  </body>
</html>
